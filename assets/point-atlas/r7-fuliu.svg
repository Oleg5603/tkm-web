<svg xmlns="http://www.w3.org/2000/svg" width="675" height="900" viewBox="0 0 675 900" role="img" aria-labelledby="title desc">
  <title id="title">Справочная схема точки R7 Фу-лю</title>
  <desc id="desc">Внутренняя сторона нижней части голени. Точка R7 отмечена перед ахилловым сухожилием, на два пропорциональных цуня выше внутренней лодыжки.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f4e9"/><stop offset="1" stop-color="#e7efe9"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfaa84"/><stop offset=".55" stop-color="#f2ccb0"/><stop offset="1" stop-color="#d4936c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173f3b" flood-opacity=".22"/></filter>
  </defs>
  <rect width="675" height="900" rx="28" fill="url(#paper)"/>
  <text x="38" y="58" fill="#173f3b" font-family="Georgia, serif" font-size="32">R7 · Фу-лю</text>
  <text x="38" y="91" fill="#647473" font-family="Arial, sans-serif" font-size="18">Внутренняя сторона голени</text>
