  <path d="M271 670 C246 706 229 753 229 812" fill="none" stroke="#f4e6d6" stroke-width="22" stroke-linecap="round" opacity=".82"/>
  <ellipse cx="383" cy="760" rx="55" ry="47" fill="#d9966d" stroke="#925e45" stroke-width="5"/>
  <path d="M298 743 L298 594" fill="none" stroke="#d4a75d" stroke-width="5" stroke-dasharray="11 10"/>
  <path d="M278 743 H318 M278 594 H318" fill="none" stroke="#9a6a35" stroke-width="5"/>
  <text x="332" y="675" fill="#725335" font-family="Arial, sans-serif" font-size="21" font-weight="700">2 пропорциональных</text>
  <text x="332" y="701" fill="#725335" font-family="Arial, sans-serif" font-size="21" font-weight="700">цуня</text>
  <circle cx="288" cy="590" r="19" fill="#b7352d" stroke="#fff" stroke-width="7" filter="url(#shadow)"/>
  <path d="M306 579 C362 542 422 527 481 527" fill="none" stroke="#b7352d" stroke-width="7" stroke-linecap="round"/>
  <rect x="444" y="484" width="188" height="80" rx="40" fill="#b7352d" filter="url(#shadow)"/>
  <text x="538" y="536" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800">R7 · Фу-лю</text>
  <path d="M242 767 C174 774 119 767 71 741" fill="none" stroke="#176c62" stroke-width="4"/>
  <text x="58" y="722" fill="#176c62" font-family="Arial, sans-serif" font-size="18" font-weight="700">ахиллово</text>
  <text x="58" y="744" fill="#176c62" font-family="Arial, sans-serif" font-size="18" font-weight="700">сухожилие</text>
  <path d="M384 760 C465 776 526 767 574 744" fill="none" stroke="#176c62" stroke-width="4"/>
  <text x="475" y="718" fill="#176c62" font-family="Arial, sans-serif" font-size="18" font-weight="700">внутренняя</text>
  <text x="475" y="740" fill="#176c62" font-family="Arial, sans-serif" font-size="18" font-weight="700">лодыжка</text>
  <text x="38" y="866" fill="#647473" font-family="Arial, sans-serif" font-size="15">Справочный ориентир. Точную локализацию проверяет врач-рефлексотерапевт.</text>
